x-app: &app
  build: .
  volumes:
    - ./Main/Lambda:/app
  working_dir: /app
  restart: unless-stopped   # keeps retrying until Kafka/HBase/HDFS are ready
  environment:
    KAFKA_BOOTSTRAP: kafka:29092
    HBASE_HOST: hbase
    HDFS_URL: http://namenode:9870
    HDFS_NN: hdfs://namenode:9000
    PG_URL: postgresql://postgres:postgres@postgres:5432/bigdata
  depends_on: [kafka, hbase, namenode, datanode, postgres]

services:
  # ---------- infrastructure ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  hbase:
    image: harisekhon/hbase:1.3
    hostname: hbase
    ports: ["16010:16010", "9090:9090"]   # master UI, thrift
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment: { CLUSTER_NAME: bdp }
    env_file: hadoop.env
    ports: ["9870:9870", "9000:9000"]
    volumes: [namenode:/hadoop/dfs/name]
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    env_file: hadoop.env
    depends_on: [namenode]
    volumes: [datanode:/hadoop/dfs/data]
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bigdata
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  grafana:       # batch-layer dashboard on http://localhost:3000
    image: grafana/grafana:10.4.2
    depends_on: [postgres]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # open without login (admin/admin also works)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bdp-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  # ---------- application ----------
  stream:        # producer + XGBoost consumer -> HBase
    <<: *app
    command: python -m Stream_layer.stream_pipeline
  hdfs-ingest:   # Kafka -> HDFS raw files
    <<: *app
    command: python -m Batch_layer.batch_pipeline
  batch-loop:    # Spark transform + predict -> PostgreSQL, every 60 s
    <<: *app
    command: python batch_loop.py
  flask:         # real-time dashboard on http://localhost:5000
    <<: *app
    command: python "real_time_web_app(Flask)/app.py"
    ports: ["5000:5000"]

volumes: { namenode: {}, datanode: {}, pgdata: {} }
